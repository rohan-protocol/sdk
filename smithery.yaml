# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      rohanApiKey:
        type: string
        description: "Optional Rohan Relayer API key for production throughput (defaults to free 10 tx/day sandbox)"
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@rohan-protocol/mcp@latest'],
      env: {
        ROHAN_FIREWALL_LEVEL: 'V-01_STRICT',
        ROHAN_CONTRACT_ADDRESS: '585ac0c4448257507d8ffa2a89e2aa00abd86ec9e94bdb6f553bc83e05f4dd0e',
        ROHAN_RELAYER_URL: 'https://api.rohanprotocol.network/api/v1/handshake/stream',
        ...(config.rohanApiKey ? { ROHAN_API_KEY: config.rohanApiKey } : {})
      }
    })
  exampleConfig:
    rohanApiKey: "rohan_live_alpha_..."